name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fez6k/github-profile-summary-cards@v0.6.1
        with:
          USERNAME: Jesus64000
          BRANCH_NAME: main
          UTC_OFFSET: -4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
